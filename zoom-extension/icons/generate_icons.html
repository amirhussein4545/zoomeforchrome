<!DOCTYPE html>
<html>
<head>
  <title>تولید آیکون‌ها</title>
</head>
<body>
  <h1>آیکون‌های افزونه Zoom Box</h1>
  <p>این فایل SVG آیکون‌ها را نمایش می‌دهد. برای استفاده در کروم، باید آنها را به PNG تبدیل کنید.</p>
  
  <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <circle cx="56" cy="56" r="40" fill="none" stroke="#667eea" stroke-width="8"/>
    <line x1="88" y1="88" x2="112" y2="112" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
    <rect x="30" y="30" width="52" height="52" fill="rgba(102, 126, 234, 0.2)" stroke="#667eea" stroke-width="3" stroke-dasharray="5,5"/>
  </svg>
  
  <p>برای تبدیل SVG به PNG می‌توانید از ابزارهای آنلاین یا نرم‌افزارهایی مانند GIMP استفاده کنید.</p>
</body>
</html>
