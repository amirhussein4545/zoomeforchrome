<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Box - زوم با کشیدن کادر</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      text-align: center;
    }
    
    .instructions {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .instructions ol {
      margin: 10px 0;
      padding-right: 20px;
    }
    
    .instructions li {
      margin-bottom: 8px;
    }
    
    .icon {
      text-align: center;
      font-size: 40px;
      margin: 10px 0;
    }
    
    .version {
      text-align: center;
      font-size: 11px;
      opacity: 0.8;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="icon">🔍</div>
  <h1>Zoom Box</h1>
  
  <div class="instructions">
    <strong>راهنمای استفاده:</strong>
    <ol>
      <li>روی آیکون افزونه کلیک کنید</li>
      <li>دکمه "فعال کردن زوم" را بزنید</li>
      <li>با موس یک کادر دور ناحیه مورد نظر بکشید</li>
      <li>به صورت خودکار روی ناحیه زوم می‌شود</li>
      <li>برای غیرفعال کردن، دکمه قرمز را بزنید</li>
    </ol>
    <p><strong>نکته:</strong> می‌توانید سطح زوم را با اسلایدر تنظیم کنید.</p>
  </div>
  
  <div class="version">نسخه 1.0.0</div>
</body>
</html>
